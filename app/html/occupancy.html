            <div class="bg-light border-right" id="sidebar-wrapper">

            <a href="mqtt.html" class="list-group-item list-group-item-action">MQTT Settings</a>
            <a href="advanced.html" class="list-group-item list-group-item-action">Advanced</a>

    <div id="page-content-wrapper" class="p-0">

<script>
/* ─────────────────────────────────────────────────────────────────── */
/* State                                                                */
/* ─────────────────────────────────────────────────────────────────── */
const AREA_COLORS = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#34495e'];

let MQTT_Client  = 0;
let app          = null;
let videoW       = 800;
let videoH       = 450;
let forcePublish = false;

/* Drawing */
let drawMode     = false;
let drawPoints   = [];        /* [{x,y}] in 0-1000 canvas space */
let mouseCanvasX = 0;
let mouseCanvasY = 0;

/* Live data */
let liveDetections = [];
const areaCounters = {};   /* area.name → counter object */
let pollTimer      = null;

/* ─────────────────────────────────────────────────────────────────── */
/* Utilities                                                            */
/* ─────────────────────────────────────────────────────────────────── */
function areaColor(idx) { return AREA_COLORS[idx % AREA_COLORS.length]; }

function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
}

function canvasCoords(canvas, evt) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: Math.round((evt.clientX - rect.left) * 1000 / rect.width),
        y: Math.round((evt.clientY - rect.top)  * 1000 / rect.height)
    };
}

function polygonCentroid(pts) {
    let sx = 0, sy = 0;
    for (const p of pts) { sx += p.x; sy += p.y; }
    return { x: sx / pts.length, y: sy / pts.length };
}

function showToast(msg, type) {
    const container = document.querySelector('.toast-container');
    const id = 'toast-' + Date.now();
    const bg = type === 'danger' ? 'bg-danger' : type === 'warning' ? 'bg-warning text-dark' : 'bg-info';
    container.insertAdjacentHTML('beforeend',
        `<div id="${id}" class="toast align-items-center text-white ${bg} border-0 show" role="alert">
            <div class="d-flex">
                <div class="toast-body">${msg}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="this.closest('.toast').remove()"></button>
            </div></div>`);
    setTimeout(() => document.getElementById(id)?.remove(), 4000);
}

/* ─────────────────────────────────────────────────────────────────── */
/* Area list                                                            */
/* ─────────────────────────────────────────────────────────────────── */
function renderAreaList() {
    const areas     = app.settings.occupancy.areas || [];
    const container = document.getElementById('area-list');
    container.innerHTML = '';

    if (areas.length === 0) {
        container.innerHTML =
            '<p class="text-muted small mb-0">No areas defined. Click <strong>+ Add Area</strong> to draw a polygon on the video.</p>';
        redrawCanvas();
        return;
    }

    areas.forEach((area, idx) => {
        const color   = areaColor(idx);
        const counter = areaCounters[area.name] || {};
        let rows = '';
        for (const [cls, val] of Object.entries(counter))
            rows += `<tr><td>${cls}</td><td><strong>${val}</strong></td></tr>`;
        if (!rows) rows = '<tr><td colspan="2" class="text-muted small">—</td></tr>';

        container.insertAdjacentHTML('beforeend',
            `<div class="card area-card" id="area-card-${area.id}">
                <div class="card-header d-flex justify-content-between align-items-center"
                     style="border-left:4px solid ${color}; background:#fafafa;">
                    <span>
                        <span class="area-color-swatch" style="background:${color};"></span>
                        <input type="text" class="area-name-input" value="${area.name}"
                               data-area-id="${area.id}">
                    </span>
                    <span class="d-flex align-items-center gap-2">
                        <div class="form-check form-switch mb-0">
                            <input class="form-check-input area-active-toggle" type="checkbox"
                                   data-area-id="${area.id}" ${area.active ? 'checked' : ''}>
                        </div>
                        <button class="btn btn-sm btn-outline-danger area-delete-btn py-0"
                                data-area-id="${area.id}" title="Delete area">&#128465;</button>
                    </span>
                </div>
                <div class="card-body p-2">
                    <table class="table table-sm counter-table mb-0">
                        <tbody id="counter-tbody-${area.id}">${rows}</tbody>
                    </table>
                </div>
            </div>`);
    });

    container.querySelectorAll('.area-delete-btn').forEach(btn =>
        btn.addEventListener('click', () => deleteArea(parseInt(btn.dataset.areaId))));
    container.querySelectorAll('.area-active-toggle').forEach(chk =>
        chk.addEventListener('change', () => toggleAreaActive(parseInt(chk.dataset.areaId), chk.checked)));
    container.querySelectorAll('.area-name-input').forEach(inp => {
        inp.addEventListener('change', () => renameArea(parseInt(inp.dataset.areaId), inp.value.trim()));
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
    });

    redrawCanvas();
}

function updateAreaCounterTable(areaId, counter) {
    const tbody = document.getElementById('counter-tbody-' + areaId);
    if (!tbody) return;
    let html = '';
    for (const [cls, val] of Object.entries(counter))
        html += `<tr><td>${cls}</td><td><strong>${val}</strong></td></tr>`;
    tbody.innerHTML = html || '<tr><td colspan="2" class="text-muted small">—</td></tr>';
}

/* ─────────────────────────────────────────────────────────────────── */
/* Canvas                                                               */
/* ─────────────────────────────────────────────────────────────────── */
function redrawCanvas() {
    const canvas = document.getElementById('area-canvas');
    const ctx    = canvas.getContext('2d');
    ctx.clearRect(0, 0, 1000, 1000);

    /* Committed areas */
    const areas = (app && app.settings.occupancy.areas) || [];
    areas.forEach((area, idx) => {
        if (!area.polygon || area.polygon.length < 3) return;
        const color = areaColor(idx);
        ctx.beginPath();
        ctx.moveTo(area.polygon[0].x, area.polygon[0].y);
        for (let i = 1; i < area.polygon.length; i++)
            ctx.lineTo(area.polygon[i].x, area.polygon[i].y);
        ctx.closePath();
        ctx.fillStyle   = hexToRgba(color, area.active ? 0.20 : 0.07);
        ctx.strokeStyle = color;
        ctx.lineWidth   = 2;
        ctx.fill();
        ctx.stroke();

        const c = polygonCentroid(area.polygon);
        ctx.font         = 'bold 28px sans-serif';
        ctx.fillStyle    = color;
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(area.name, c.x, c.y);
    });

    /* In-progress polygon */
    if (drawMode && drawPoints.length > 0) {
        ctx.setLineDash([6, 4]);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth   = 2;
        ctx.beginPath();
        ctx.moveTo(drawPoints[0].x, drawPoints[0].y);
        for (let i = 1; i < drawPoints.length; i++)
            ctx.lineTo(drawPoints[i].x, drawPoints[i].y);
        ctx.lineTo(mouseCanvasX, mouseCanvasY);
        ctx.stroke();
        ctx.setLineDash([]);

        drawPoints.forEach((p, i) => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, i === 0 ? 8 : 5, 0, Math.PI * 2);
            ctx.fillStyle   = i === 0 ? '#00ff88' : '#ffffff';
            ctx.strokeStyle = '#333';
            ctx.lineWidth   = 1.5;
            ctx.fill();
            ctx.stroke();
        });
    }

    /* Live detection boxes */
    ctx.lineWidth    = 3;
    ctx.strokeStyle  = '#FFFF00';
    ctx.fillStyle    = '#FFFF00';
    ctx.font         = '28px Arial';
    ctx.textAlign    = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.beginPath();
    liveDetections.forEach(det => {
        if (typeof det !== 'object' || !det) return;
        ctx.rect(det.x, det.y, det.w, det.h);
        let text = det.class || 'Unknown';
        if (det.age !== undefined) {
            let age = det.age.toFixed(1) + 's';
            if (det.age > 3600)     age = Math.floor(det.age / 3600) + 'h';
            else if (det.age > 60)  age = Math.floor(det.age / 60)   + 'm';
            text += ' ' + age;
        }
        ctx.fillText(text, det.x, det.y - 6);
    });
    ctx.stroke();
}

/* ─────────────────────────────────────────────────────────────────── */
/* Draw mode                                                            */
/* ─────────────────────────────────────────────────────────────────── */
function startDrawMode() {
    drawMode   = true;
    drawPoints = [];
    document.getElementById('area-canvas').classList.add('draw-mode');
    document.getElementById('btn-add-area').style.display    = 'none';
    document.getElementById('btn-cancel-draw').style.display = '';
    const hint = document.getElementById('draw-hint');
    hint.style.display = '';
    hint.textContent   = 'Click to place vertices. Click the first point (green) or double-click to close the polygon.';
}

function cancelDrawMode() {
    drawMode   = false;
    drawPoints = [];
    document.getElementById('area-canvas').classList.remove('draw-mode');
    document.getElementById('btn-add-area').style.display    = '';
    document.getElementById('btn-cancel-draw').style.display = 'none';
    document.getElementById('draw-hint').style.display       = 'none';
    redrawCanvas();
}

function commitPolygon() {
    if (drawPoints.length < 3) {
        showToast('A polygon needs at least 3 points.', 'warning');
        return;
    }
    const areas = app.settings.occupancy.areas || [];
    const maxId = areas.reduce((m, a) => Math.max(m, a.id || 0), 0);
    areas.push({
        id:      maxId + 1,
        name:    'Area ' + (maxId + 1),
        active:  true,
        polygon: drawPoints.map(p => ({ x: p.x, y: p.y }))
    });
    app.settings.occupancy.areas = areas;
    cancelDrawMode();
    saveOccupancySettings(() => renderAreaList());
}

/* ─────────────────────────────────────────────────────────────────── */
/* Area CRUD                                                            */
/* ─────────────────────────────────────────────────────────────────── */
function deleteArea(id) {
    if (!confirm('Delete this area?')) return;
    app.settings.occupancy.areas = (app.settings.occupancy.areas || []).filter(a => a.id !== id);
    saveOccupancySettings(() => renderAreaList());
}

function toggleAreaActive(id, active) {
    const area = (app.settings.occupancy.areas || []).find(a => a.id === id);
    if (area) { area.active = active; saveOccupancySettings(); redrawCanvas(); }
}

function renameArea(id, name) {
    if (!name) return;
    const area = (app.settings.occupancy.areas || []).find(a => a.id === id);
    if (area) { area.name = name; saveOccupancySettings(); redrawCanvas(); }
}

/* ─────────────────────────────────────────────────────────────────── */
/* Persistence                                                          */
/* ─────────────────────────────────────────────────────────────────── */
function saveOccupancySettings(callback) {
    const occ         = app.settings.occupancy;
    occ.moving        = $('#count-moving').is(':checked');
    occ.stationary    = $('#count-stationary').is(':checked');
    occ.ageThreshold  = parseFloat($('#age-threshold').val())  || 2.0;
    occ.idleThreshold = parseFloat($('#idle-threshold').val()) || 3.0;
    occ.holdTime      = parseFloat($('#hold-time').val())      || 3.0;
    $.ajax({
        type: 'POST', url: 'settings', contentType: 'application/json',
        data: JSON.stringify({ occupancy: occ }),
        success: () => { showToast('Settings saved', 'info'); if (callback) callback(); },
        error:   () => showToast('Failed to save settings', 'danger')
    });
}

/* ─────────────────────────────────────────────────────────────────── */
/* Status polling (counter display without MQTT subscription)          */
/* ─────────────────────────────────────────────────────────────────── */
function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(() => {
        $.getJSON('app', data => {
            const occStatus = (data.status && data.status.occupancy) ? data.status.occupancy : {};
            (app.settings.occupancy.areas || []).forEach(area => {
                const entry = occStatus['area_' + area.id];
                if (entry && entry.counter) {
                    areaCounters[area.name] = entry.counter;
                    updateAreaCounterTable(area.id, entry.counter);
                }
            });
        });
    }, 2000);
}

/* ─────────────────────────────────────────────────────────────────── */
/* MQTT                                                                 */
/* ─────────────────────────────────────────────────────────────────── */
function ConnectWebSocketClient() {
    updateConnectionStatus('connecting');
    const clientID = 'WS-' + app.manifest.acapPackageConf.setup.appName + '-' +
                     app.device.serial + '-' + Math.floor(Math.random() * 10000);
    if (MQTT_Client) { try { MQTT_Client.disconnect(); } catch(e) {} }
    const tls  = app.settings.tls || location.protocol === 'https:';
    const port = tls ? app.settings.WSS_Port : app.settings.WS_Port;
    MQTT_Client = new Paho.MQTT.Client(app.mqtt.address, port, clientID);
    MQTT_Client.onConnectionLost = onConnectionLost;
    MQTT_Client.onMessageArrived = onMessageArrived;
    const opts = { useSSL: tls, timeout: 3, onSuccess: onConnect, onFailure: onFailure };
    if (app.mqtt.user     && app.mqtt.user.length)     opts.userName = app.mqtt.user;
    if (app.mqtt.password && app.mqtt.password.length) opts.password = app.mqtt.password;
    MQTT_Client.connect(opts);
}

function updateConnectionStatus(status) {
    const el = document.getElementById('connectionStatus');
    const msg = document.getElementById('statusMessage');
    el.className = 'connection-status';
    if (status === 'connected')   msg.textContent = 'Connected';
    if (status === 'disconnected') { el.classList.add('status-disconnected'); msg.textContent = 'Disconnected'; }
    if (status === 'connecting' || status === 'reconnecting') {
        el.classList.add('status-connecting');
        msg.textContent = status.charAt(0).toUpperCase() + status.slice(1);
    }
}

function onConnect() {
    updateConnectionStatus('connected');
    const pre = app.mqtt.preTopic, ser = app.device.serial;
    MQTT_Client.subscribe(pre + '/detections/' + ser);
    MQTT_Client.subscribe(pre + '/occupancy/' + ser);
    MQTT_Client.subscribe(pre + '/occupancy/' + ser + '/#');
}

function onFailure(message) {
    updateConnectionStatus('disconnected');
    showToast(message.errorMessage + ' — check WebSocket settings', 'warning');
}

function onConnectionLost(responseObject) {
    if (responseObject.errorCode !== 0) {
        showToast(responseObject.errorMessage, 'warning');
        updateConnectionStatus('disconnected');
        setTimeout(() => ConnectWebSocketClient(), 5000);
    }
}

function onMessageArrived(message) {
    const parts   = message.topic.split('/');
    const section = parts[1];
    let payload;
    try { payload = JSON.parse(message.payloadString); } catch(e) { return; }
    if (!payload) return;

    if (section === 'detections') {
        liveDetections = payload.list || [];
        redrawCanvas();
        return;
    }
    if (section === 'occupancy' && payload.occupancy) {
        if (payload.area) {
            /* Per-area topic */
            areaCounters[payload.area] = payload.occupancy;
            const area = (app.settings.occupancy.areas || []).find(a => a.name === payload.area);
            if (area) updateAreaCounterTable(area.id, payload.occupancy);
        }
        /* Whole-frame fallback ignored (no area list shown in that mode) */
    }
}

/* ─────────────────────────────────────────────────────────────────── */
/* Video                                                                */
/* ─────────────────────────────────────────────────────────────────── */
function PlayVideo(aspect, rotation) {
    videoW = 800; videoH = 450;
    let vW = 1280, vH = 720;
    switch (aspect) {
        case '4:3':   videoW = 800; videoH = 600; vW = 800;  vH = 600; break;
        case '1:1':   videoW = 800; videoH = 800; vW = 640;  vH = 640; break;
        case '16:10': videoW = 800; videoH = 500; vW = 800;  vH = 500; break;
        default:      videoW = 800; videoH = 450; vW = 1280; vH = 720; break;
    }
    if (rotation === 90 || rotation === 270) { const t = videoW; videoW = videoH; videoH = t; }
    $('#video-view').css({ width: videoW + 'px', height: videoH + 'px' });
    const videoEl = document.createElement('media-stream-player');
    videoEl.setAttribute('hostname', app.device.IPv4);
    videoEl.setAttribute('autoplay', '');
    videoEl.setAttribute('secure', location.protocol === 'https:');
    videoEl.style.width  = '100%';
    videoEl.style.height = '100%';
    document.getElementById('video').appendChild(videoEl);
}

/* ─────────────────────────────────────────────────────────────────── */
/* Init                                                                 */
/* ─────────────────────────────────────────────────────────────────── */
$(document).ready(function() {
    $.ajax({
        type: 'GET', url: 'app', dataType: 'json', cache: false,
        success: function(data) {
            app = data;
            document.title = app.manifest.acapPackageConf.setup.friendlyName;
            $('.sidebar-heading').text(app.manifest.acapPackageConf.setup.friendlyName);

            const toggle  = document.getElementById('pageToggle');
            const content = document.getElementById('locationContent');
            toggle.checked = app.settings.publish.occupancy;
            content.classList.toggle('hidden', !app.settings.publish.occupancy);

            toggle.addEventListener('change', function() {
                app.settings.publish.occupancy = this.checked;
                $.ajax({
                    type: 'POST', url: 'settings', contentType: 'application/json',
                    data: JSON.stringify({ publish: app.settings.publish }),
                    error: () => showToast('Failed saving settings', 'danger')
                });
                content.classList.toggle('hidden', !this.checked);
            });

            /* Populate threshold controls */
            const occ = app.settings.occupancy || {};
            if (!occ.areas) occ.areas = [];
            $('#count-moving').prop('checked',    !!occ.moving);
            $('#count-stationary').prop('checked', !!occ.stationary);
            $('#age-threshold').val(occ.ageThreshold  != null ? occ.ageThreshold  : 2.0);
            $('#idle-threshold').val(occ.idleThreshold != null ? occ.idleThreshold : 3.0);
            $('#hold-time').val(occ.holdTime != null ? occ.holdTime : 3.0);

            $('#count-moving, #count-stationary, #age-threshold, #idle-threshold, #hold-time')
                .on('change', () => saveOccupancySettings());

            /* Enable detections temporarily for canvas overlay if needed */
            if (app.settings.publish.detections === false) {
                forcePublish = true;
                app.settings.publish.detections = true;
                $.ajax({
                    type: 'POST', url: 'settings', contentType: 'application/json',
                    data: JSON.stringify({ publish: app.settings.publish })
                });
            }

            renderAreaList();
            PlayVideo(app.device.aspect || '16:9', app.settings.scene.rotation);

            /* Canvas interaction */
            const canvas = document.getElementById('area-canvas');

            canvas.addEventListener('mousemove', evt => {
                const p = canvasCoords(canvas, evt);
                mouseCanvasX = p.x; mouseCanvasY = p.y;
                if (drawMode) redrawCanvas();
            });

            canvas.addEventListener('click', evt => {
                if (!drawMode) return;
                const p = canvasCoords(canvas, evt);
                if (drawPoints.length >= 3) {
                    const fp   = drawPoints[0];
                    const dist = Math.hypot(p.x - fp.x, p.y - fp.y);
                    if (dist < 20) { commitPolygon(); return; }
                }
                drawPoints.push(p);
                redrawCanvas();
            });

            canvas.addEventListener('dblclick', evt => {
                if (!drawMode) return;
                /* The second click of a dblclick already added a point — remove it */
                drawPoints.pop();
                commitPolygon();
            });

            document.getElementById('btn-add-area').addEventListener('click', startDrawMode);
            document.getElementById('btn-cancel-draw').addEventListener('click', cancelDrawMode);

            if (app.status.mqtt && app.status.mqtt.connected) {
                ConnectWebSocketClient();
            } else {
                setTimeout(() => {
                    updateConnectionStatus('disconnected');
                    showToast('DataQ is not connected to a broker. Go to MQTT Settings.', 'warning');
                }, 100);
            }

            startPolling();
        },
        error: function() {
            showToast('The application is not running', 'danger');
            updateConnectionStatus('Disconnected');
        }
    });
});

window.addEventListener('beforeunload', function(event) {
    if (forcePublish) {
        app.settings.publish.detections = false;
        navigator.sendBeacon('settings',
            new Blob([JSON.stringify({ publish: app.settings.publish })],
                     { type: 'application/json' }));
    }
    event.returnValue = '';
});
</script>
</body>
</html>
